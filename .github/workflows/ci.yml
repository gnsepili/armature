name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, schemas, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: schemas match packages/schema
        run: pnpm schemas && git diff --exit-code schemas
      - run: pnpm build
      - name: bundled CLI works from a path with spaces
        shell: bash
        run: |
          demo="$RUNNER_TEMP/bundle smoke/demo"
          node packages/cli/dist/armature.js init "$demo" --yes --name demo --tool lookup_order:read:order_id
          node packages/cli/dist/armature.js eval validate --static "$demo"
          node packages/cli/dist/armature.js test --only golden "$demo"

  unit:
    name: unit · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: generated projects · ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      ARMATURE_IT_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:integration (projects under a path with spaces)
        run: pnpm test:integration
        env:
          ARMATURE_IT_OUT: ${{ runner.temp }}/armature it/generated projects
